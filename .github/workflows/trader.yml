name: Paper Trading Robot

# Samay GitHub me UTC me likhte hain. India (IST) = UTC + 5:30
# Robot ab din me kuch hi baar "jagaya" jaata hai. Ek baar jag jaye to wo khud ghanton tak chalta hai
# aur har 15 minute me khud kharid/bikri check karta hai (market band hone tak).
on:
  schedule:
    - cron: '12 2 * * 1-5'    # 7:42 am IST  (aaj ki list + din bhar ka chakkar shuru)
    - cron: '42 3 * * 1-5'    # 9:12 am IST  (backup)
    - cron: '17 4 * * 1-5'    # 9:47 am IST  (backup)
    - cron: '47 6 * * 1-5'    # 12:17 pm IST (backup)
  workflow_dispatch:           # haath se chalane ka button
    inputs:
      mode:
        description: 'loop = poora din chalao (roz isi ko dabaiye). Baaki sirf test ke liye.'
        default: 'loop'
        type: choice
        options:
          - loop
          - auto
          - test
          - scan
          - buy
          - check
          - eod

permissions:
  contents: write
  actions: write

concurrency:
  group: paper-trader
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Code download
        uses: actions/checkout@v4

      - name: Python taiyar karna
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Zaroori packages
        run: pip install -r requirements.txt

      - name: Data branch taiyar karna
        run: |
          set -e
          git config user.name "paper-trading-bot"
          git config user.email "paper-trading-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data > /dev/null 2>&1; then
            git fetch origin data
            git worktree add -B data _data origin/data
          else
            git worktree add --orphan -b data _data
          fi

      - name: Robot chalana
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATA_DIR: ${{ github.workspace }}/_data
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ github.event.inputs.mode || 'loop' }}
          REPO: ${{ github.repository }}
        run: |
          save_data() {
            ( cd _data
              git add -A
              if git diff --cached --quiet; then
                echo "Kuch naya nahi, save karne ki zaroorat nahi."
              else
                git commit -q -m "data update $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"
                for i in 1 2 3; do
                  git push -q origin HEAD:data && break
                  git pull -q --rebase origin data || true
                  sleep 3
                done
              fi
            ) || true
          }

          if [ "$MODE" != "loop" ]; then
            python trader.py --mode "$MODE" || true
            save_data
            exit 0
          fi

          # ---- poora din ka chakkar ----
          END="${LOOP_END:-1630}"            # shaam 4:30 pm IST tak
          PAUSE="${LOOP_SLEEP:-780}"         # har chakkar ke baad 13 minute ruko (chakkar milakar ~15 min)
          MAXSECS="${LOOP_MAXSECS:-19800}"   # 5.5 ghante baad naya run shuru karke ye band
          START=$(date +%s)
          while true; do
            NOW=$(TZ=Asia/Kolkata date +%H%M)
            DOW=$(TZ=Asia/Kolkata date +%u)
            TODAY=$(TZ=Asia/Kolkata date +%F)
            if [ "$DOW" -ge 6 ]; then echo "Weekend hai, kuch nahi karna."; break; fi
            if [ "$((10#$NOW))" -ge "$((10#$END))" ]; then echo "Din ka kaam khatam."; break; fi

            python trader.py --mode auto || true
            save_data

            if grep -q "\"eod_done\": \"$TODAY\"" _data/state.json 2>/dev/null; then
              echo "Aaj ka hisaab ho gaya."; break
            fi

            if [ "$(( $(date +%s) - START ))" -ge "$MAXSECS" ]; then
              echo "GitHub ki 6 ghante ki seema paas hai, naya run shuru kar raha hoon."
              gh workflow run trader.yml --repo "$REPO" -f mode=loop || true
              break
            fi
            sleep "$PAUSE"
          done

      - name: Aakhri data save
        if: always()
        run: |
          cd _data
          git add -A
          if ! git diff --cached --quiet; then
            git commit -q -m "data update (final) $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"
            for i in 1 2 3; do
              git push -q origin HEAD:data && break
              git pull -q --rebase origin data || true
              sleep 3
            done
          fi
